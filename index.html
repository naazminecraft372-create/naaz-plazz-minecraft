```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAAZ PLAZA MINECRAFT</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f9f9f9;color:#111}
header{height:64px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5;border-bottom:1px solid #eee}
.logo{font-size:21px;font-weight:bold;color:#e62117}
.logo span{color:#111}
button{cursor:pointer;border:0;border-radius:20px;padding:10px 16px;font-weight:bold}
.login-btn{background:#eee}
.layout{display:flex}
aside{width:210px;padding:20px 12px;background:white;min-height:calc(100vh - 64px)}
aside button{display:block;width:100%;text-align:left;background:transparent;margin-bottom:8px;font-size:15px}
aside button:hover{background:#eee}
main{padding:24px;width:100%;max-width:1400px;margin:auto}
.banner{background:linear-gradient(120deg,#151515,#434343);color:white;border-radius:15px;padding:35px 25px;margin-bottom:25px}
.banner h1{margin:0 0 10px;font-size:30px}
.banner p{margin:0;color:#ddd}
h2{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #00000010}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#ddd;display:block}
.info{padding:12px}
.info h3{font-size:16px;margin:0 0 10px}
.info a{color:#555;text-decoration:none;font-size:13px}
.delete{background:#ffe5e5;color:#b00000;margin-top:10px}
.tag{font-size:11px;background:#eee;padding:5px 9px;border-radius:10px;display:inline-block;margin-bottom:8px}
.empty{color:#777;padding:25px 0}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:10;align-items:center;justify-content:center;padding:15px}
.box{background:white;border-radius:14px;padding:24px;width:100%;max-width:420px}
.box h2{margin-top:0}
input,select{width:100%;padding:13px;margin:8px 0 14px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.primary{background:#e62117;color:white}
.cancel{background:#eee;margin-left:8px}
.status{font-size:13px;color:#b00000;min-height:18px}
footer{text-align:center;color:#888;padding:30px}
@media(max-width:650px){
 aside{width:65px;padding:12px 5px}
 aside button{font-size:0;text-align:center;padding:12px 3px}
 main{padding:14px}
 .banner{padding:25px 18px}
 .banner h1{font-size:23px}
 header{padding:0 12px}
 .logo{font-size:17px}
}
</style>
</head>
<body>

<header>
  <div class="logo">▶ <span>NAAZ PLAZA MINECRAFT</span></div>
  <button class="login-btn" onclick="openLogin()">Author Login</button>
</header>

<div class="layout">
<aside>
  <button onclick="showAll()">🏠 Home</button>
  <button onclick="showAll()">🎬 Videos</button>
  <button onclick="showShorts()">📱 Shorts</button>
  <button onclick="openLogin()">🔐 Author Login</button>
</aside>

<main>
  <section class="banner">
    <h1>NAAZ PLAZA MINECRAFT</h1>
    <p>Welcome to the official Minecraft gaming channel!</p>
    <p style="margin-top:12px">@naaz_plaza_minecraft</p>
  </section>

  <h2 id="heading">Latest Videos</h2>
  <div class="grid" id="videos">
    <p class="empty">Loading videos...</p>
  </div>
</main>
</div>

<footer>© NAAZ PLAZA MINECRAFT</footer>

<div class="modal" id="loginModal">
  <div class="box">
    <h2>Author Login</h2>
    <input type="password" id="adminKey" placeholder="Enter Admin Secret Key">
    <p class="status" id="loginStatus"></p>
    <button class="primary" onclick="login()">Login</button>
    <button class="cancel" onclick="closeLogin()">Cancel</button>
  </div>
</div>

<div class="modal" id="addModal">
  <div class="box">
    <h2>Publish Video</h2>
    <input id="videoTitle" placeholder="Video title">
    <input id="videoUrl" placeholder="YouTube video URL">
    <select id="videoType">
      <option value="false">Normal Video</option>
      <option value="true">YouTube Short</option>
    </select>
    <p class="status" id="addStatus"></p>
    <button class="primary" onclick="addVideo()">Publish</button>
    <button class="cancel" onclick="closeAdd()">Cancel</button>
  </div>
</div>

<script>
const API = "/.netlify/functions/videos";
let adminToken = sessionStorage.getItem("naaz_admin_token") || "";
let currentFilter = "all";
let videoCache = [];

async function apiRequest(method = "GET", body = null, token = adminToken) {
  const headers = {};
  if (body) headers["Content-Type"] = "application/json";
  if (token) headers["Authorization"] = "Bearer " + token;

  const response = await fetch(API, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined
  });

  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "Request failed");
  return data;
}

async function loadVideos() {
  const container = document.getElementById("videos");
  try {
    const data = await apiRequest();
    videoCache = data.videos || [];
    renderVideos();
  } catch (error) {
    container.innerHTML = '<p class="empty">Unable to load videos. Please refresh and try again.</p>';
  }
}

function renderVideos() {
  const container = document.getElementById("videos");
  const list = currentFilter === "shorts"
    ? videoCache.filter(v => v.short)
    : videoCache;

  if (!list.length) {
    container.innerHTML = '<p class="empty">Abhi koi video publish nahi hua hai.</p>';
    return;
  }

  container.replaceChildren();

  list.forEach(video => {
    const card = document.createElement("article");
    card.className = "card";

    const img = document.createElement("img");
    img.className = "thumb";
    img.src = video.thumbnail;
    img.alt = video.title;
    img.loading = "lazy";

    const info = document.createElement("div");
    info.className = "info";

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = video.short ? "SHORT" : "VIDEO";

    const title = document.createElement("h3");
    title.textContent = video.title;

    const link = document.createElement("a");
    link.href = video.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "▶ Watch on YouTube";

    info.append(tag, title, link);

    if (adminToken) {
      const del = document.createElement("button");
      del.className = "delete";
      del.textContent = "Delete";
      del.onclick = () => deleteVideo(video.id);
      info.appendChild(del);
    }

    card.append(img, info);
    container.appendChild(card);
  });
}

function showAll() {
  currentFilter = "all";
  document.getElementById("heading").textContent = "Latest Videos";
  renderVideos();
}

function showShorts() {
  currentFilter = "shorts";
  document.getElementById("heading").textContent = "YouTube Shorts";
  renderVideos();
}

function openLogin() {
  if (adminToken) {
    openAdd();
    return;
  }
  document.getElementById("loginModal").style.display = "flex";
}

function closeLogin() {
  document.getElementById("loginModal").style.display = "none";
}

async function login() {
  const key = document.getElementById("adminKey").value;
  const status = document.getElementById("loginStatus");
  status.textContent = "Checking...";

  try {
    await apiRequest("POST", { action: "check" }, key);
    adminToken = key;
    sessionStorage.setItem("naaz_admin_token", key);
    closeLogin();
    openAdd();
    renderVideos();
  } catch (error) {
    status.textContent = "Incorrect password. Please try again";
  }
}

function openAdd() {
  document.getElementById("addModal").style.display = "flex";
}

function closeAdd() {
  document.getElementById("addModal").style.display = "none";
}

function getVideoId(url) {
  try {
    const parsed = new URL(url);
    let id = "";

    if (parsed.hostname.includes("youtu.be")) {
      id = parsed.pathname.slice(1);
    } else if (parsed.hostname.includes("youtube.com")) {
      if (parsed.pathname === "/watch") {
        id = parsed.searchParams.get("v") || "";
      } else {
        const parts = parsed.pathname.split("/");
        if (["shorts", "embed", "live"].includes(parts[1])) {
          id = parts[2] || "";
        }
      }
    }

    return /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
  } catch {
    return null;
  }
}

async function addVideo() {
  const title = document.getElementById("videoTitle").value.trim();
  const url = document.getElementById("videoUrl").value.trim();
  const short = document.getElementById("videoType").value === "true";
  const status = document.getElementById("addStatus");
  const id = getVideoId(url);

  if (!title || !id) {
    status.textContent = "Please enter a valid title and YouTube URL.";
    return;
  }

  status.textContent = "Publishing...";

  try {
    await apiRequest("POST", { id, title, short });
    document.getElementById("videoTitle").value = "";
    document.getElementById("videoUrl").value = "";
    closeAdd();
    showAll();
    await loadVideos();
  } catch (error) {
    status.textContent = error.message;
  }
}

async function deleteVideo(id) {
  if (!confirm("Are you sure you want to delete this video?")) return;

  try {
    await apiRequest("DELETE", { id });
    await loadVideos();
  } catch (error) {
    alert(error.message);
  }
}

loadVideos();
</script>
</body>
</html>
